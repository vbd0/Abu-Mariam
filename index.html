<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#111;--ph:#000;--pd:#000;--pl:#f1f1f1;--pg:rgba(17,17,17,.86);--gt:rgba(255,255,255,.58);--gb:rgba(255,255,255,.55);--ring:rgba(0,0,0,.25);--bg:#f6f6f4;--tx:#161616;--mu:#6b6b6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;transition:background-color .8s}
body.hb{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;transition:background-color .9s}
body::before{inset:-15% -15% auto auto;width:70vw;height:70vw;max-width:620px;max-height:620px;background:var(--p);opacity:.28}
body::after{inset:auto auto -15% -15%;width:65vw;height:65vw;max-width:560px;max-height:560px;background:var(--pl);opacity:.9}
#app{flex:1;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.glass{background:var(--gt);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--gb);box-shadow:0 8px 32px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.65);transition:background-color .8s,border-color .8s}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(255,255,255,.92)}}
.wrap{max-width:1100px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;margin:10px 10px 0;border-radius:22px;padding:8px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--tx);font-weight:800;font-size:16px;white-space:nowrap}
.lg{height:42px;width:42px;object-fit:contain;mix-blend-mode:multiply;border-radius:10px}
.search{flex:1;min-width:0;border:1px solid var(--gb);background:rgba(255,255,255,.6);border-radius:16px;padding:8px 12px;outline:none}
.search:focus,input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--ring)}
.ib{border:0;background:none;font-size:22px;cursor:pointer;position:relative;padding:4px;text-decoration:none}
.bd{position:absolute;top:-4px;left:-4px;background:var(--p);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;transition:background-color .6s}
.hero{margin:14px 0;border-radius:26px;padding:30px 22px;text-align:center}
.hero h1{font-size:clamp(24px,6vw,40px);font-weight:800}.hero p{color:var(--mu);margin-top:6px}
/* carousel */
.car{margin:14px 0;border-radius:26px;overflow:hidden;touch-action:pan-y}
.slides{display:grid}
.sl{grid-area:1/1;display:grid;grid-template-columns:1fr 1.1fr;gap:14px;padding:16px;align-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s}
.sl.on{opacity:1;pointer-events:auto}
.si img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;background:#eee;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.st h2{font-size:clamp(17px,4.6vw,28px);font-weight:800;margin:8px 0 2px;line-height:1.35}
.bdg{display:inline-block;background:var(--p);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;transition:background-color .8s}
.pr{color:var(--p);font-weight:800;transition:color .8s}.pr.big{font-size:clamp(18px,5vw,26px)}
.btn.sm{display:inline-block;padding:8px 18px;font-size:13px;border-radius:14px;margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;padding:2px 0 10px}
.dt{width:8px;height:8px;border-radius:99px;border:0;background:rgba(0,0,0,.25);cursor:pointer;transition:.5s;padding:0}
.dt.on{width:24px;background:var(--p)}
.prog{height:3px;background:rgba(0,0,0,.07)}
.prog i{display:block;height:100%;background:var(--p);animation:pg 5s linear forwards}
@keyframes pg{from{width:0}to{width:100%}}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pill,.chip{border:1px solid var(--gb);background:var(--gt);border-radius:99px;padding:7px 16px;cursor:pointer;white-space:nowrap;transition:.4s}
.pill.on,.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.fl{border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.fl select{border:1px solid var(--gb);background:rgba(255,255,255,.7);border-radius:12px;padding:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}.sl{padding:24px;gap:26px}.si img{max-width:340px}}
.card{border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .3s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.card .in{padding:10px 12px 12px}.card h3{font-size:14px}
.sz{font-size:11px;color:var(--mu);margin-top:4px}
.pd{display:grid;gap:18px;margin-top:14px}@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.main{width:100%;border-radius:24px;aspect-ratio:1;object-fit:cover;background:#eee}
.th{display:flex;gap:8px;margin-top:8px}.th img{width:64px;height:64px;border-radius:14px;object-fit:cover;cursor:pointer;border:2px solid transparent}.th img.on{border-color:var(--p)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bbb;cursor:pointer;transition:.3s}
.sw.on{box-shadow:0 0 0 3px var(--p)}
.chip{min-width:46px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.btn{border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--pg);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.12);transition:background-color .8s,transform .15s,filter .2s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--gt);color:var(--tx);border:1px solid var(--gb)}
.bar{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:18px;padding:6px;display:flex;gap:6px}
.bar .btn{padding:8px 14px;font-size:12.5px;border-radius:13px;white-space:nowrap}
/* footer: static at end of every page */
footer.glass{margin:28px 10px 12px;border-radius:24px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.fb{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.fi{display:flex;gap:16px;justify-content:center}
.fi a,.fi button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--tx);border-radius:50%;background:rgba(255,255,255,.6);border:1px solid var(--gb);cursor:pointer;transition:transform .2s}
.fi a:active,.fi button:active{transform:scale(.92)}
.fi svg{width:22px;height:22px;fill:currentColor}
.cp{font-size:12px}
.locpop{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,380px);padding:12px 18px;border-radius:18px;z-index:99;text-align:center;font-size:14px;line-height:1.8;white-space:pre-line;background:rgba(255,255,255,.88);cursor:pointer}
.ci{display:flex;gap:10px;border-radius:20px;padding:10px;margin-bottom:10px;align-items:center}
.ci img{width:76px;height:76px;border-radius:14px;object-fit:cover}.ci .f{flex:1;min-width:0}
.q{display:flex;gap:8px;align-items:center}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gb);background:var(--gt);cursor:pointer}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(17,17,17,.88);color:#fff;padding:10px 18px;border-radius:14px;z-index:99;font-size:14px;backdrop-filter:blur(10px)}
.box{border-radius:22px;padding:16px;margin-bottom:14px}
h2{margin:10px 0}.mu{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<footer id="ft"></footer>

<div class="fl glass"><select id="fs"><option value="">المقاس</option>${[...Array(10)].map((_,i)=>`<option ${F.size==35+i?'selected':''}>${35+i}</option>`).join('')}</select>
<select id="fc"><option value="">اللون</option>${C.map(c=>`<option ${F.color==c.n?'selected':''}>${c.n}</option>`).join('')}</select></div>
<div class="grid" id="grid">${gridHtml()}</div></div>`;
bindHead();document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{F.cat=b.dataset.c;home()});
$('#fs').onchange=e=>{F.size=e.target.value;$('#grid').innerHTML=gridHtml()};$('#fc').onchange=e=>{F.color=e.target.value;$('#grid').innerHTML=gridHtml()};
document.querySelectorAll('.dt').forEach(d=>d.onclick=()=>{goSlide(+d.dataset.i);startCar()});
const car=$('#car');if(car){let x0=0;car.ontouchstart=e=>{x0=e.touches[0].clientX};car.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45){goSlide(ci+(dx<0?1:-1));startCar()}}}
startCar()}
function bindHead(){const q=$('#q');if(q)q.oninput=e=>{F.q=e.target.value;if(location.hash.startsWith('#/p')||location.hash.startsWith('#/cart')){location.hash='#/'}else if($('#grid'))$('#grid').innerHTML=gridHtml()}}
function prod(id){const p=P.find(x=>x.id==id);if(!p)return home();if(sel.id!=id)sel={id,size:'',color:'',img:0};
setTh(sel.color||p.colors[0]?.h);
$('#app').innerHTML=head()+`<div class="wrap"><div class="pd"><div><img class="main" src="${img(p,sel.img)}" alt=""><div class="th">${[0,1,2,3].filter(i=>p.images[i]||i==0).map(i=>`<img class="${sel.img==i?'on':''}" src="${img(p,i)}" onclick="sel.img=${i};prod('${id}')">`).join('')}</div></div>
<div><h2>${esc(p.name)}</h2><div class="pr" style="font-size:24px">${money(p.price)}</div><p class="mu" style="margin:10px 0">${esc(p.desc)}</p>
<b>المقاس</b><div class="row">${p.sizes.map(s=>`<button class="chip ${sel.size==s?'on':''}" onclick="sel.size=${s};prod('${id}')">${s}</button>`).join('')}</div>
<b>اللون</b><div class="row">${p.colors.map(c=>`<div class="sw ${sel.color==c.h?'on':''}" title="${esc(c.n)}" style="background:${c.h}" onclick="sel.color='${c.h}';prod('${id}')"></div>`).join('')}</div>
<p class="mu">${p.stock<5?'⚠️ الكمية محدودة':'متوفر'}</p></div></div></div>
<div class="bar glass"><button class="btn" id="a1">إضافة للسلة</button><button class="btn g" id="a2">طلب عبر واتساب مباشر</button></div>`;
bindHead();const ok=()=>{if(!sel.size||!sel.color){toast('اختر المقاس واللون أولاً');return null}return p.colors.find(c=>c.h==sel.color)};
$('#a1').onclick=()=>{const c=ok();if(!c)return;const k=id+sel.size+c.n,ex=cart.find(x=>x.k==k);ex?ex.qty++:cart.push({k,id,name:p.name,size:sel.size,color:c.n,qty:1,price:p.price});saveCart();location.hash='#/cart'};
$('#a2').onclick=()=>{const c=ok();if(!c)return;p.rc++;rest('rpc/bump',{method:'POST',body:JSON.stringify({pid:p.id,n:1})}).catch(()=>{});wa(`مرحبا أبو مريم 👋\nاريد طلب هذا المنتج:\n📦 المنتج: ${p.name}\n📏 المقاس: ${sel.size}\n🎨 اللون: ${c.n}\n💰 السعر: ${money(p.price)}\n🖼️ صورة المنتج: ${imgUrl(p)}`)}}
const wa=t=>window.open(`https://wa.me/${S.phone}?text=${encodeURIComponent(t)}`,'_blank');
const imgUrl=p=>p.images[0]&&p.images[0].startsWith('http')?p.images[0]:location.href.split('#')[0]+'#/p/'+p.id;
function cartPg(){theme(curTh);const tot=cart.reduce((a,c)=>a+c.qty*c.price,0);
$('#app').innerHTML=head()+`<div class="wrap"><h2>سلة التسوق</h2>${cart.length?cart.map((c,i)=>{const p=P.find(x=>x.id==c.id);return`<div class="ci glass"><img src="${p?img(p):''}"><div class="f"><b>${esc(c.name)}</b><div class="mu">مقاس ${c.size} · ${esc(c.color)}</div><div class="pr">${money(c.price*c.qty)}</div></div><div class="q"><button onclick="qty(${i},1)">+</button>${c.qty}<button onclick="qty(${i},-1)">−</button></div></div>`}).join('')+`<div class="box glass"><b>المجموع الكلي: ${money(tot)}</b></div><button class="btn" style="width:100%" id="ck">تأكيد الطلب عبر واتساب</button>`:'<p class="mu">السلة فارغة</p><a class="btn" style="display:inline-block;margin-top:10px;text-decoration:none" href="#/">تصفح المنتجات</a>'}</div>`;
bindHead();const b=$('#ck');if(b)b.onclick=()=>{let m='طلب جديد من أبو مريم 👋\n\n';cart.forEach((c,i)=>{const p=P.find(x=>x.id==c.id);if(p){p.rc+=c.qty;rest('rpc/bump',{method:'POST',body:JSON.stringify({pid:p.id,n:c.qty})}).catch(()=>{})}m+=`${i+1}- ${c.name} - مقاس ${c.size} - لون ${c.color} - ${money(c.price)} × ${c.qty}\n🖼️ ${p?imgUrl(p):''}\n`});m+=`\nالمجموع الكلي: ${tot} جنيه\n------------------`;wa(m)}}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);saveCart();cartPg()}
function route(){clearInterval(ct);const h=location.hash||'#/';window.scrollTo(0,0);document.body.classList.toggle('hb',h.startsWith('#/p/'));const m=h.match(/^#\/p\/(.+)/);if(m)prod(m[1]);else if(h.startsWith('#/cart'))cartPg();else home();if(!h.startsWith('#/p/'))sel={}}
window.addEventListener('hashchange',route);load().then(()=>{foot();route()}).catch(()=>{$('#app').innerHTML='<p style="padding:40px;text-align:center">تعذّر الاتصال بالخادم</p>'});
</script>
</body>
</html>
